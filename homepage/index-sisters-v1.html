function tile(ch,frame){
  const k=ch+(frame||0);if(tileCache[k])return tileCache[k];
  const c=document.createElement('canvas');c.width=TS;c.height=TS;const x=c.getContext('2d');
  const f=(col,a,b,w,h)=>{x.fillStyle=PAL[col];x.fillRect(a,b,w,h);};
  const brick=(base,mortar)=>{f(base,0,0,16,16);for(let r=0;r<16;r+=8){f(mortar,0,r,16,1);f(mortar,(r/8)%2?4:12,r,1,8);}f(mortar,0,15,16,1);};
  switch(ch){
    case '#':brick(OR,BR);f(LR,1,1,3,1);f(LR,13,9,2,1);break;
    case '=':brick(LGY,GY);f(WH,1,1,3,1);break;
    case 'B':brick(RD,K);f(LR,1,1,2,1);break;
    case '?':f(OR,0,0,16,16);f(YE,1,1,14,14);f(WH,2,2,3,1);x.drawImage(glyph('?',K,1),4,4);break;
    case '!':f(BL,0,0,16,16);f(CY,1,1,14,14);f(WH,2,2,3,1);x.drawImage(glyph('!',K,1),4,4);break;
    case 'U':f(DG,0,0,16,16);f(GY,1,1,14,14);f(DG,4,4,8,8);break;
    case 'T':f(GY,0,0,16,16);f(LGY,0,0,16,5);f(WH,0,0,16,1);f(DG,0,5,16,1);f(DG,2,6,2,10);f(LGY,12,6,2,10);break;

    case '~':f(BL,0,0,16,16);f(LB,0,0,16,3);f(WH,frame?8:0,1,4,1);f(WH,frame?0:8,2,3,1);f(LB,frame?4:10,9,4,1);break;

let rng=1;function rand(){rng=(rng*1103515245+12345)&0x7fffffff;return rng/0x7fffffff;}

function genLevel(n){
  rng=n*7919+13;
  const rows=Array.from({length:ROWS},()=>[]);
  const ensure=c=>{for(const r of rows)while(r.length<=c)r.push(' ');};
  const set=(c,r,ch)=>{if(r<0||r>=ROWS)return;ensure(c);rows[r][c]=ch;};
  const ground=(c,len)=>{for(let i=0;i<len;i++){set(c+i,10,'#');set(c+i,11,'#');}};
  const diff=Math.min(1+(n-1)*.3,2.6);
  let x=0;ground(0,14);set(6,6,'?');set(7,6,'?');set(8,6,'!');x=14;
  const sections=11+Math.min(n,7);
  for(let s=0;s<sections;s++){
    const r=rand();
    if(r<.26){
      const len=9+Math.floor(rand()*6);ground(x,len);
      const bx=x+2+Math.floor(rand()*(len-7)),bn=3+Math.floor(rand()*3);
      for(let i=0;i<bn;i++){const q=rand();set(bx+i,6,q<.5?'?':q<.85?'B':'!');}
      if(rand()<.45){for(let i=-1;i<bn+1;i++)set(bx+i,3,'=');for(let i=0;i<bn;i++)set(bx+i,2,'D');}
      if(rand()<.7*diff)set(x+len-3,9,'o');
      x+=len;
    }else if(r<.46){
      const w=2+Math.floor(rand()*Math.min(3,Math.round(diff)));
      if(rand()<.5)set(x+Math.floor(w/2),7,'D');
      x+=w;ground(x,4);if(rand()<.5)set(x+1,9,'D');x+=4;
    }else if(r<.6){
      const len=7+Math.floor(rand()*4);ground(x,len);
      const h=1+Math.floor(rand()*3);for(let i=0;i<h;i++)set(x+2,9-i,i===h-1?'T':'|');
      if(rand()<.6)set(x+2,9-h-1,'D');
      if(len>9){const h2=1+Math.floor(rand()*3);for(let i=0;i<h2;i++)set(x+len-3,9-i,i===h2-1?'T':'|');}
      if(rand()<.6*diff)set(x+5,9,'o');
      x+=len;
    }else if(r<.74){
      const h=3+Math.floor(rand()*2);ground(x,h+2);
      for(let i=0;i<h;i++)for(let j=0;j<=i;j++)set(x+1+i,9-j,'=');
      set(x+h,9-h,'D');
      x+=h+2;const pit=2+Math.floor(rand()*2);x+=pit;
      ground(x,h+3);for(let i=0;i<h;i++)for(let j=0;j<=h-1-i;j++)set(x+1+i,9-j,'=');
      x+=h+3;
    }else if(r<.9){
      const len=11+Math.floor(rand()*4);ground(x,len);
      for(let i=2;i<len-3;i+=4){const py=5+Math.floor(rand()*3);for(let j=0;j<3;j++)set(x+i+j,py,'=');set(x+i+1,py-2,'D');}
      if(rand()<.75*diff)set(x+Math.floor(len/2),2,'w');
      x+=len;
    }else{
      const len=6+Math.floor(rand()*5);
      for(let i=0;i<len;i++){set(x+i,10,'~');set(x+i,11,'~');set(x+i,9,'^');}
      if(rand()<.7)set(x+Math.floor(len/2),8,'o');
      if(rand()<.5)set(x+2,6,'D');
      x+=len;ground(x,3);x+=3;
    }
  }
  ground(x,18);for(let i=0;i<4;i++)for(let j=0;j<=i;j++)set(x+2+i,9-j,'=');set(x+5,5,'D');set(x+13,9,'E');x+=18;ensure(x+1);
  return rows.map(r=>r);
}

let camX=0,timeLeft=300,lives=3,score=0,diamonds=0,best=0;
try{best=parseInt(localStorage.getItem('certsisters.hi'))||0;}catch(e){}
const pl={x:0,y:0,w:10,h:22,vx:0,vy:0,ground:false,face:1,punk:false,dead:false,anim:0,inv:0,jumpHeld:false,deathT:0,ox:3};
const keys={left:false,right:false,jump:false};let jumpEdge=false,muted=false;
function loadLevel(n){
  map=genLevel(n);levelW=map[0].length;entities=[];particles=[];bumps=[];floaters=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<levelW;c++){
    const ch=map[r][c];
    if(ch==='o'){entities.push({t:'owl',x:c*TS,y:r*TS+2,w:14,h:14,vx:-(.45+n*.06),vy:0,dead:0,f:0});map[r][c]=' ';}
    else if(ch==='w'){entities.push({t:'wasp',x:c*TS,y:r*TS,w:14,h:7,vx:.8+n*.08,vy:0,base:r*TS,ph:rand()*6,dead:0,f:0});map[r][c]=' ';}
    else if(ch==='D'){entities.push({t:'gem',x:c*TS+4,y:r*TS+5,w:8,h:6,dead:0});map[r][c]=' ';}
    else if(ch==='E'){entities.push({t:'door',x:c*TS,y:r*TS-16,w:16,h:32,dead:0});map[r][c]=' ';}
  }
  pl.x=2*TS+3;pl.y=10*TS-pl.h;pl.vx=0;pl.vy=0;pl.dead=false;pl.inv=0;pl.face=1;camX=0;timeLeft=300;
}
const at=(c,r)=>(r<0||r>=ROWS||c<0||c>=levelW)?(r>=ROWS?' ':' '):map[r][c];
const solidAt=(c,r)=>SOLID.has(at(c,r));
function rectSolid(x,y,w,h){const c0=Math.floor(x/TS),c1=Math.floor((x+w-1)/TS),r0=Math.floor(y/TS),r1=Math.floor((y+h-1)/TS);for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(solidAt(c,r))return true;return false;}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

// ═══════════════════════════ AUDIO ═══════════════════════════
let AC=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f,d,type='square',v=.1,when=0,slide){if(!AC||muted)return;const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}
const sfx={jump:()=>tone(300,.18,'square',.08,0,700),gem:()=>{tone(1400,.08,'square',.07);tone(1900,.14,'square',.07,.07);},bump:()=>tone(140,.1,'square',.1,0,90),
  stomp:()=>tone(500,.12,'square',.1,0,120),die:()=>{[600,500,400,300,200,120].forEach((f,i)=>tone(f,.14,'square',.1,i*.1));},power:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.1,'square',.08,i*.06)),
  brk:()=>tone(200,.15,'sawtooth',.1,0,60),clear:()=>[784,784,784,1047,880,1047,1319].forEach((f,i)=>tone(f,.15,'square',.09,i*.12)),life:()=>[1047,1319,1568,2093].forEach((f,i)=>tone(f,.12,'square',.08,i*.08))};
const LEAD=[72,76,79,76,72,76,79,76,74,77,81,77,74,77,81,77,76,79,83,79,76,79,83,79,77,81,84,81,79,84,88,84,72,76,79,84,79,76,72,76,74,77,81,86,81,77,74,77,76,79,83,88,83,79,76,79,77,81,84,89,84,81,79,77];
const BASS=[48,48,55,55,50,50,57,57,52,52,59,59,53,53,55,55,48,55,48,55,50,57,50,57,52,59,52,59,53,55,53,55];
const mf=m=>440*Math.pow(2,(m-69)/12);
let musicOn=false,nextNote=0,noteI=0;
function music(dt){
  if(!AC||muted||!musicOn)return;
  while(nextNote<AC.currentTime+.2){
    const t=Math.max(nextNote,AC.currentTime);
    tone(mf(LEAD[noteI%LEAD.length]),.09,'square',.045,t-AC.currentTime);
    if(noteI%2===0)tone(mf(BASS[(noteI/2)%BASS.length]),.16,'triangle',.09,t-AC.currentTime);
    nextNote+=.105;noteI++;
  }
}
function startMusic(){if(!AC)return;musicOn=true;nextNote=AC.currentTime;noteI=0;}

// ═══════════════════════════ INPUT ═══════════════════════════
const KEYMAP={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',w:'jump',W:'jump',' ':'jump',x:'jump',X:'jump'};
function press(){initAudio();if(AC&&AC.state==='suspended')AC.resume();}
addEventListener('keydown',e=>{
  press();const k=KEYMAP[e.key];
  if(k){if(k==='jump'&&!keys.jump)jumpEdge=true;keys[k]=true;e.preventDefault();}
  if(e.key==='m'||e.key==='M')muted=!muted;
  if((e.key===' '||e.key==='Enter')&&state!=='play'){e.preventDefault();confirmKey();}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)keys[k]=false;});
const touch=document.getElementById('touch');
if(matchMedia('(pointer:coarse)').matches)touch.classList.add('on');
touch.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();press();if(k==='jump'&&!keys.jump)jumpEdge=true;keys[k]=true;b.classList.add('dn');if(state!=='play')confirmKey();};
  const off=()=>{keys[k]=false;b.classList.remove('dn');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});
cv.addEventListener('pointerdown',e=>{press();if(e.pointerType==='touch')touch.classList.add('on');if(state!=='play')confirmKey();});
function confirmKey(){
  if(state==='title'){level=1;lives=3;score=0;diamonds=0;loadLevel(level);state='play';stateT=0;startMusic();setBorder(K);}
  else if(state==='over'&&stateT>1.5){state='title';stateT=0;}
  else if(state==='win'&&stateT>1.5){state='title';stateT=0;}
}

// ═══════════════════════════ UPDATE ═══════════════════════════
const GRAV=.34,GRAV_HOLD=.21,JUMP_V=-6.4,MAXVX=2.1;
function addScore(n){score+=n;if(score>best){best=score;try{localStorage.setItem('certsisters.hi',String(best));}catch(e){}}}
function addDiamond(x,y){diamonds++;addScore(50);sfx.gem();floaters.push({x,y,t:40,s:'50',c:CY});if(diamonds%100===0){lives++;sfx.life();floaters.push({x,y:y-10,t:60,s:'1UP',c:LG});}}
function bumpTile(c,r){
  const ch=at(c,r);if(!SOLID.has(ch))return;
  bumps.push({c,r,t:10});
  if(ch==='?'){map[r][c]='U';entities.push({t:'gemrise',x:c*TS+4,y:r*TS+2,w:8,h:6,dead:0,vy:-1.6,life:22});addDiamond(c*TS+4,r*TS-6);}
  else if(ch==='!'){map[r][c]='U';entities.push({t:'power',x:c*TS+4,y:r*TS-8,w:8,h:7,dead:0,vx:.7});sfx.power();}
  else if(ch==='B'&&pl.punk){map[r][c]=' ';addScore(10);sfx.brk();for(let i=0;i<6;i++)particles.push({x:c*TS+8,y:r*TS+8,vx:(rand()-.5)*3,vy:-2-rand()*2.5,t:40,c:RD});}
  else sfx.bump();
  for(const e of entities){if((e.t==='owl'||e.t==='wasp')&&!e.dead&&Math.floor((e.x+e.w/2)/TS)===c&&Math.floor((e.y+e.h)/TS)===r){e.dead=1;e.vy=-4;addScore(100);}}
}
function killPlayer(){if(pl.dead)return;pl.dead=true;pl.vy=-6;pl.deathT=0;musicOn=false;sfx.die();}
function hurt(){if(pl.inv>0||pl.dead)return;if(pl.punk){pl.punk=false;pl.inv=90;sfx.bump();}else killPlayer();}
function updatePlay(dt){
  if(pl.dead){
    pl.deathT++;pl.vy+=GRAV;pl.y+=pl.vy;
    if(pl.deathT>90){lives--;if(lives<=0){state='over';stateT=0;}else{loadLevel(level);startMusic();}}
    return;
  }
  timeLeft-=dt;if(timeLeft<=0){timeLeft=0;killPlayer();return;}
  if(pl.inv>0)pl.inv--;
  const ax=keys.left?-1:keys.right?1:0;
  if(ax){pl.vx+=ax*.16;pl.face=ax;}else pl.vx*=pl.ground?.78:.95;
  if(Math.abs(pl.vx)<.05&&!ax)pl.vx=0;
  const mv=MAXVX*(pl.punk?1.15:1);pl.vx=Math.max(-mv,Math.min(mv,pl.vx));
  if(jumpEdge&&pl.ground){pl.vy=JUMP_V;pl.ground=false;sfx.jump();}
  jumpEdge=false;
  pl.vy+=(keys.jump&&pl.vy<0)?GRAV_HOLD:GRAV;pl.vy=Math.min(pl.vy,7);
  // horizontal
  let nx=pl.x+pl.vx;
  if(pl.vx>0&&rectSolid(nx,pl.y,pl.w,pl.h)){nx=Math.floor((nx+pl.w)/TS)*TS-pl.w-.01;pl.vx=0;}
  else if(pl.vx<0&&rectSolid(nx,pl.y,pl.w,pl.h)){nx=Math.floor(nx/TS+1)*TS+.01;pl.vx=0;}
  pl.x=Math.max(0,nx);
  // vertical
  let ny=pl.y+pl.vy;pl.ground=false;
  if(pl.vy>0&&rectSolid(pl.x,ny,pl.w,pl.h)){ny=Math.floor((ny+pl.h)/TS)*TS-pl.h;pl.vy=0;pl.ground=true;}
  else if(pl.vy<0&&rectSolid(pl.x,ny,pl.w,pl.h)){
    const r=Math.floor(ny/TS);ny=(r+1)*TS;pl.vy=0;
    const cx=pl.x+pl.w/2;const c=Math.floor(cx/TS);const cands=[c,Math.floor(pl.x/TS),Math.floor((pl.x+pl.w-1)/TS)].filter(cc=>solidAt(cc,r));
    if(cands.length)bumpTile(cands[0],r);
  }
  pl.y=ny;
  if(pl.y>ROWS*TS+8)killPlayer();
  // camera
  const target=pl.x-120;camX+=(target-camX)*.2;camX=Math.max(0,Math.min(levelW*TS-W,camX));
  // entities
  const pbox={x:pl.x,y:pl.y,w:pl.w,h:pl.h};
  for(const e of entities){
    if(e.dead){
      if(e.t==='owl'||e.t==='wasp'){e.vy+=GRAV;e.y+=e.vy;e.dead++;if(e.y>ROWS*TS+20)e.dead=999;}
      continue;
    }
    if(e.x<camX-64||e.x>camX+W+64){if(e.t!=='gemrise')continue;}
    if(e.t==='owl'){
      e.f=(e.f+.12)%2;const ahead=e.vx>0?e.x+e.w+1:e.x-1;
      const rBelow=Math.floor((e.y+e.h+1)/TS),cAhead=Math.floor(ahead/TS);
      if(solidAt(cAhead,Math.floor((e.y+e.h-1)/TS))||!solidAt(cAhead,rBelow))e.vx=-e.vx;
      e.x+=e.vx;e.vy+=GRAV;let ey=e.y+e.vy;if(e.vy>0&&rectSolid(e.x,ey,e.w,e.h)){ey=Math.floor((ey+e.h)/TS)*TS-e.h;e.vy=0;}e.y=ey;
      if(e.y>ROWS*TS)e.dead=999;
    }else if(e.t==='wasp'){
      e.f=(e.f+.35)%2;e.ph+=.08;e.x+=e.vx;e.y=e.base+Math.sin(e.ph)*22;
      if(rectSolid(e.x+(e.vx>0?e.w:0),e.y,1,e.h)||e.x<0||e.x>levelW*TS-16)e.vx=-e.vx;
    }else if(e.t==='gemrise'){
      e.y+=e.vy;e.vy+=.06;if(--e.life<=0)e.dead=999;continue;
    }else if(e.t==='power'){
      e.x+=e.vx;if(rectSolid(e.x+(e.vx>0?e.w:0),e.y,1,e.h))e.vx=-e.vx;e.vy=(e.vy||0)+GRAV;let ey=e.y+e.vy;if(e.vy>0&&rectSolid(e.x,ey,e.w,e.h)){ey=Math.floor((ey+e.h)/TS)*TS-e.h;e.vy=0;}e.y=ey;
      if(overlap(pbox,e)){e.dead=999;pl.punk=true;addScore(500);floaters.push({x:e.x,y:e.y,t:50,s:'PUNK!',c:YE});sfx.power();}
      continue;
    }
    if(e.t==='gem'){if(overlap(pbox,e)){e.dead=999;addDiamond(e.x,e.y);}continue;}
    if(e.t==='door'){if(overlap(pbox,{x:e.x+4,y:e.y,w:8,h:e.h})&&pl.ground){state='clear';stateT=0;musicOn=false;sfx.clear();}continue;}
    if(overlap(pbox,e)){
      if(pl.vy>0&&pl.y+pl.h-e.y<10){e.dead=1;e.vy=-3;pl.vy=-4.2;addScore(100);sfx.stomp();floaters.push({x:e.x,y:e.y-6,t:40,s:'100',c:WH});}
      else hurt();
    }
  }
  entities=entities.filter(e=>e.dead<200||e.dead===1||(e.dead>1&&e.dead<200));
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.t--;});particles=particles.filter(p=>p.t>0);
  floaters.forEach(f=>{f.y-=.5;f.t--;});floaters=floaters.filter(f=>f.t>0);
  bumps.forEach(b=>b.t--);bumps=bumps.filter(b=>b.t>0);
  pl.anim+=Math.abs(pl.vx)*.12;
}

// ═══════════════════════════ RENDER ═══════════════════════════
function renderWorld(){
  fill(LB,0,HUD,W,H-HUD);fill(BL,0,HUD,W,10);
  const cx=Math.floor(camX);
  const cl=Math.floor(cx*.2)%W;ctx.drawImage(CLOUDS,-cl,HUD+8);ctx.drawImage(CLOUDS,W-cl,HUD+8);
  const hl=Math.floor(cx*.45)%W;ctx.drawImage(HILLS,-hl,HUD+120);ctx.drawImage(HILLS,W-hl,HUD+120);
  fill(GR,0,HUD+158,W,H-HUD-158);
  const c0=Math.floor(cx/TS),c1=c0+W/TS+1,wf=Math.floor(tick/12)%2;
  for(let r=0;r<ROWS;r++)for(let c=c0;c<=c1;c++){
    const ch=at(c,r);if(ch===' ')continue;
    let oy=0;for(const b of bumps)if(b.c===c&&b.r===r)oy=-Math.round(Math.sin(b.t/10*Math.PI)*5);
    const t=tile(ch,ch==='~'?wf:0);if(t)ctx.drawImage(t,c*TS-cx,r*TS+HUD+oy);
  }
  const gemF=Math.floor(tick/10)%2?DIAMOND:DIAMOND2;
  for(const e of entities){
    if(e.dead>=200)continue;
    const ex=Math.round(e.x-cx),ey=Math.round(e.y+HUD);
    if(ex<-40||ex>W+40)continue;
    if(e.t==='gem'||e.t==='gemrise')ctx.drawImage(gemF,ex,ey);
    else if(e.t==='door')ctx.drawImage(DOOR,ex,ey);
    else if(e.t==='power')ctx.drawImage(BUBBLE,ex,ey);
    else if(e.t==='owl'){const img=OWL[Math.floor(e.f)];if(e.dead){ctx.save();ctx.translate(ex+8,ey+16);ctx.scale(1,-1);ctx.drawImage(img,-8,0);ctx.restore();}else if(e.vx>0){ctx.save();ctx.translate(ex+16,ey);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore();}else ctx.drawImage(img,ex,ey);}
    else if(e.t==='wasp'){const img=WASP[Math.floor(e.f)];if(e.vx<0){ctx.save();ctx.translate(ex+16,ey);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore();}else ctx.drawImage(img,ex,ey);}
  }
  // player
  if(!(pl.inv>0&&Math.floor(tick/3)%2===0)||pl.dead){
    const set=pl.punk?PUNK:PLAYER;
    const img=pl.dead?set.jump:!pl.ground?set.jump:Math.abs(pl.vx)>.3?(Math.floor(pl.anim)%2?set.run1:set.run2):set.stand;
    const px=Math.round(pl.x-pl.ox-cx),py=Math.round(pl.y+HUD-2);
    ctx.save();
    if(pl.face<0){ctx.translate(px+16,py);ctx.scale(-1,1);ctx.drawImage(img,0,0);}else ctx.drawImage(img,px,py);
    ctx.restore();
  }
  particles.forEach(p=>fill(p.c,Math.round(p.x-cx),Math.round(p.y+HUD),2,2));
  floaters.forEach(f=>text(f.s,Math.round(f.x-cx),Math.round(f.y+HUD),f.c));
}
function renderHUD(){
  fill(K,0,0,W,HUD);
  ctx.drawImage(DIAMOND,2,1);text(String(diamonds).padStart(3,'0'),12,0,CY);
  text('SCORE '+String(score).padStart(6,'0'),48,0,WH);
  text('L'+level,152,0,YE);
  text('TIME '+String(Math.ceil(timeLeft)).padStart(3,'0'),184,0,timeLeft<30&&Math.floor(tick/8)%2?RD:LGY);
  text('♥'+lives,272,0,LR,1,true);
  if(muted)text('M',304,0,DG);
}
function renderTitle(){
  setBorder(BL);fill(BL,0,0,W,H);
  // checker floor + bricks
  for(let c=0;c<20;c++){ctx.drawImage(tile('#'),c*16,168);ctx.drawImage(tile('#'),c*16,184);}
  for(let c=3;c<7;c++)ctx.drawImage(tile(c===5?'?':'='),c*16,120);
  ctx.drawImage(tile('?'),224,120);ctx.drawImage(tile('!'),240,120);
  textC('CERT SISTERS',22,RD,3);textC('CERT SISTERS',20,YE,3);
  textC('THE GREAT PKI ADVENTURE',48,LGY);
  const cyc=[WH,CY,LB,LR,YE,LG];const col=cyc[Math.floor(stateT*7)%cyc.length];
  const g=norm(GREETING);const sc=g.length<=18?2:1;textC(g,sc===2?64:68,col,sc);
  const hi=HOST_INFO.indexOf(':');
  if(hi>-1){const a=HOST_INFO.slice(0,hi+1),b=HOST_INFO.slice(hi+1).trim();const tot=norm(a).length+1+norm(b).length;const x=Math.floor((W-tot*8)/2);text(a,x,88,LGY);text(b,x+(norm(a).length+1)*8,88,LG);}else textC(HOST_INFO,88,LG);
  const bob=Math.abs(Math.sin(stateT*4))*14;ctx.drawImage(PLAYER[bob>2?'jump':'stand'],72,144-bob);
  ctx.drawImage(OWL[Math.floor(stateT*6)%2],200,154);
  ctx.drawImage(Math.floor(stateT*5)%2?DIAMOND:DIAMOND2,84,106-Math.round(Math.sin(stateT*3)*3));
  if(Math.floor(stateT*2)%2===0)textC('PRESS SPACE OR TAP TO PLAY',104,WH);
  textC('HI-SCORE '+String(best).padStart(6,'0'),132,CY);
  textC('CURSOR/WASD MOVE   SPACE/UP JUMP   M SOUND',148,DG);
  textC('(C) 2026 PKI SOFTWORKS',184,K);
}
function renderClear(){
  renderWorld();renderHUD();
  fill(K,56,56,208,80);fill(WH,58,58,204,76);fill(BL,62,62,196,68);
  textC('LEVEL '+level+' CLEAR',70,YE,2);
  const bonus=Math.floor(timeLeft)*10;
  textC('TIME BONUS '+String(bonus).padStart(4,'0'),96,CY);
  textC('DIAMONDS   '+String(diamonds).padStart(4,'0'),108,CY);
  if(stateT>2.2)textC('GET READY...',120,WH);
}
function renderOver(){
  renderWorld();renderHUD();
  fill(K,56,64,208,64);fill(WH,58,66,204,60);fill(RD,62,70,196,52);
  textC('GAME OVER',80,WH,2);textC('SCORE '+String(score).padStart(6,'0'),104,YE);
  if(stateT>1.5&&Math.floor(stateT*2)%2===0)textC('SPACE / TAP FOR TITLE',114,WH);
}
function renderWin(){
  setBorder(K);fill(K,0,0,W,H);
  textC('CERT DELIVERED!',30,YE,2);
  textC('YOU CLEARED ALL LEVELS',60,LG);
  textC('THE CLOUD SERVER IS SECURE',72,CY);
  textC('SCORE '+String(score).padStart(6,'0'),96,WH,2);
  textC('DIAMONDS '+diamonds,120,CY);
  ctx.drawImage(pl.punk?PUNK.stand:PLAYER.stand,152,136);ctx.drawImage(DOOR,180,128);
  if(stateT>1.5&&Math.floor(stateT*2)%2===0)textC('SPACE / TAP FOR TITLE',176,WH);
}

// ═══════════════════════════ LOOP ═══════════════════════════
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){let dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;while(acc>=STEP){step(STEP);acc-=STEP;}render();requestAnimationFrame(frame);}
function step(dt){
  stateT+=dt;tick++;
  if(state==='play')updatePlay(dt);
  else if(state==='clear'&&stateT>3.5){addScore(Math.floor(timeLeft)*10);level++;if(level>QS.get('levels')*1||level>5){state='win';stateT=0;}else{loadLevel(level);state='play';stateT=0;startMusic();}}
  music(dt);
}
function render(){
  if(state==='title')renderTitle();
  else if(state==='play'){renderWorld();renderHUD();}
  else if(state==='clear')renderClear();
  else if(state==='over')renderOver();
  else renderWin();
}
function fit(){const vw=innerWidth,vh=innerHeight;let s=Math.min(vw/W,vh/H);if(s>=2)s=Math.floor(s);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fit);fit();requestAnimationFrame(frame);
if(QS.has('debug'))window.__cs={get s(){return {state,level,lives,score,diamonds,x:pl.x,y:pl.y,ground:pl.ground,dead:pl.dead,levelW,ents:entities.length};},map:()=>map.map(r=>r.join('')),door:()=>entities.find(e=>e.t==='door'),pl,keys,jump:()=>{jumpEdge=true;},load:n=>{loadLevel(n);state='play';},kill:()=>killPlayer()};
})();
</script>
