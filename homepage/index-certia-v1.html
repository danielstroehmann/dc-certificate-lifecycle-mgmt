<script>
(()=>{
'use strict';
// ═══════════════════════════ CORE ═══════════════════════════
// Internal resolution is the classic 320x200; a room is 10 x 3 tiles of 32 x 63 px,
// the bottom 11 px are the status bar.
const W=320,H=200,TW=32,TH=63,VH=189,FY=55,RCOLS=10,RROWS=3;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const QS=new URLSearchParams(location.search);const DEBUG=QS.has('debug');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ss=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const eo=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t);};
const ei=t=>{t=clamp(t,0,1);return t*t;};
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash(a,b,c){let h=(a*374761393+b*668265263+(c|0)*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9 .,:;!?'"\-\/()+%=<>&*\[\]#_@]/g,' ');

// ═══════════════════════════ BITMAP FONT (5x7) ═══════════════════════════
const GL={A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[30,17,17,17,17,17,30],
E:[31,16,16,30,16,16,31],F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],I:[14,4,4,4,4,4,14],
J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],L:[16,16,16,16,16,16,31],M:[17,27,21,21,17,17,17],N:[17,17,25,21,19,17,17],
O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],
T:[31,4,4,4,4,4,4],U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],X:[17,17,10,4,10,17,17],
Y:[17,17,17,10,4,4,4],Z:[31,1,2,4,8,16,31],0:[14,17,19,21,25,17,14],1:[4,12,4,4,4,4,14],2:[14,17,1,2,4,8,31],
3:[31,2,4,2,1,17,14],4:[2,6,10,18,31,2,2],5:[31,16,30,1,1,17,14],6:[6,8,16,30,17,17,14],7:[31,1,2,4,8,8,8],
8:[14,17,17,14,17,17,14],9:[14,17,17,15,1,2,12],'.':[0,0,0,0,0,12,12],',':[0,0,0,0,12,4,8],':':[0,12,12,0,12,12,0],
';':[0,12,12,0,12,4,8],'!':[4,4,4,4,4,0,4],'?':[14,17,1,2,4,0,4],"'":[4,4,8,0,0,0,0],'"':[10,10,0,0,0,0,0],
'-':[0,0,0,14,0,0,0],'/':[1,1,2,4,8,16,16],'(':[2,4,8,8,8,4,2],')':[8,4,2,2,2,4,8],'+':[0,4,4,31,4,4,0],
'%':[24,25,2,4,8,19,3],'=':[0,0,31,0,31,0,0],'<':[2,4,8,16,8,4,2],'>':[8,4,2,1,2,4,8],'&':[12,18,20,8,21,18,13],
'*':[0,4,21,14,21,4,0],'[':[14,8,8,8,8,8,14],']':[14,2,2,2,2,2,14],'#':[10,10,31,10,31,10,10],'_':[0,0,0,0,0,0,31],
'@':[14,17,23,21,23,16,14]};
const GC=new Map();
function glyph(ch,col,sc){
  const k=ch+col+sc;let g=GC.get(k);if(g)return g;
  g=document.createElement('canvas');g.width=5*sc;g.height=7*sc;const x=g.getContext('2d');x.fillStyle=col;
  const d=GL[ch];if(d)for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(d[r]&(16>>c))x.fillRect(c*sc,r*sc,sc,sc);
  GC.set(k,g);return g;
}
const textW=(s,sc=1)=>Math.max(0,String(s).length*6*sc-sc);
function text(s,x,y,col,sc=1,sh){
  s=norm(s);x=Math.round(x);y=Math.round(y);
  if(sh){for(let i=0;i<s.length;i++)if(s[i]!==' ')ctx.drawImage(glyph(s[i],sh,sc),x+i*6*sc+sc,y+sc);}
  for(let i=0;i<s.length;i++)if(s[i]!==' ')ctx.drawImage(glyph(s[i],col,sc),x+i*6*sc,y);
}
const textC=(s,cx,y,col,sc=1,sh)=>text(s,cx-textW(norm(s),sc)/2,y,col,sc,sh);
function wrap(s,max){const out=[];let line='';for(const w of norm(s).split(/\s+/)){if(!w)continue;if((line+' '+w).trim().length>max){if(line)out.push(line);line=w;}else line=(line+' '+w).trim();}if(line)out.push(line);return out;}

// ═══════════════════════════ AUDIO (WebAudio synth) ═══════════════════════════
let AC=null,MG=null,NB=null,muted=false,audioOn=false;
try{muted=localStorage.getItem('certia.muted')==='1';}catch(e){}
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  MG=AC.createGain();MG.gain.value=muted?0:.75;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  MG.connect(comp);comp.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  audioOn=true;
}
function setMute(m){muted=m;try{localStorage.setItem('certia.muted',m?'1':'0');}catch(e){}if(MG)MG.gain.setTargetAtTime(m?0:.75,AC.currentTime,.02);}
const okA=()=>AC&&audioOn&&AC.state==='running';
function tone(type,f0,f1,dur,vol,dt=0,fl){
  if(!okA())return;const t=AC.currentTime+dt;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.012,dur*.2));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let n=o;if(fl){const f=AC.createBiquadFilter();f.type=fl[0];f.frequency.value=fl[1];f.Q.value=fl[2]||1;o.connect(f);n=f;}
  n.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,type,f0,f1,dt=0,q=1){
  if(!okA())return;const t=AC.currentTime+dt;
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter(),g=AC.createGain();
  f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.01,dur*.2));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*.5);s.stop(t+dur+.05);
}
let stepAlt=0;
const SFX={
  step(){stepAlt^=1;noise(.05,.07,'lowpass',stepAlt?700:520);tone('sine',stepAlt?120:105,70,.05,.05);},
  pad(){noise(.03,.035,'lowpass',600);},
  jump(){noise(.2,.05,'bandpass',500,1400,0,1.2);tone('sawtooth',150,105,.12,.05,0,['lowpass',700]);},
  grunt(){tone('sawtooth',125,80,.16,.07,0,['lowpass',600]);tone('square',62,45,.14,.03,0,['lowpass',300]);},
  land(){tone('sine',95,45,.13,.16);noise(.09,.08,'lowpass',380);},
  thud(){tone('sine',75,32,.32,.25);noise(.22,.14,'lowpass',320);this.grunt();},
  splat(){tone('sine',60,25,.5,.3);noise(.35,.2,'lowpass',260);},
  grab(){noise(.04,.06,'bandpass',1500,900,0,2);tone('triangle',300,200,.05,.03);},
  climb(){noise(.18,.03,'bandpass',800,500,0,1);},
  crumble(){for(let i=0;i<6;i++)noise(.04,.05,'bandpass',900+Math.random()*1200,0,i*.05,3);},
  crash(){noise(.5,.22,'lowpass',1600,200);tone('sine',70,30,.4,.2);for(let i=0;i<5;i++)noise(.05,.06,'bandpass',1200+Math.random()*1800,0,.05+i*.06,4);},
  tick(){tone('square',1900,1600,.018,.025,0,['bandpass',1800,4]);},
  rumble(){noise(.12,.05,'lowpass',180);tone('triangle',55,50,.12,.04);},
  slam(){noise(.3,.2,'lowpass',900,120);tone('square',90,40,.2,.08,0,['lowpass',400]);},
  plate(){tone('square',180,120,.05,.05,0,['lowpass',800]);noise(.08,.05,'lowpass',500);},
  clash(){[1820,2710,3960,5120].forEach((f,i)=>tone(i%2?'square':'triangle',f,f*.98,.28-i*.04,.05-i*.008,0,['highpass',900]));noise(.07,.12,'highpass',3000);},
  swish(){noise(.14,.07,'bandpass',2600,700,0,1.5);},
  hit(){noise(.1,.12,'lowpass',700);tone('sine',140,60,.16,.12);this.grunt();},
  shing(){noise(.14,.08,'highpass',4200,2000);tone('triangle',2600,2400,.18,.04);},
  chop(){this.shing();tone('square',160,80,.06,.06,.1,['lowpass',600]);noise(.05,.08,'lowpass',900,0,.1);},
  gulp(){for(let i=0;i<3;i++)tone('sine',340-i*30,170,.09,.08,i*.16);},
  bubble(){tone('sine',600+Math.random()*500,1200,.04,.012);},
  draw(){noise(.16,.06,'highpass',2500,5000);tone('triangle',1400,2200,.14,.03);},
  door(){noise(1.6,.06,'lowpass',160,90);tone('triangle',48,44,1.6,.04);},
  pickup(){[0,4,7,12].forEach((s,i)=>tone('triangle',293.66*Math.pow(2,s/12),0,.18,.07,i*.08));},
  wiggle(){tone('square',220+Math.random()*60,180,.03,.015,0,['lowpass',500]);},
};
// ── music: tiny sequencer over D Hijaz (original melodies) ──
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function nf(n){const m=/^([A-G][#b]?)(\d)$/.exec(n);if(!m)return 0;return 440*Math.pow(2,(NOTE[m[1]]+(+m[2]+1)*12-69)/12);}
let musicGen=0;
function playSong(song,loop){
  if(!okA())return 0;const gen=++musicGen;const bpm=song.bpm,beat=60/bpm;let t=0;
  const lead=song.lead.trim().split(/\s+/);
  for(const tok of lead){const [n,d]=tok.split(':');const dur=parseFloat(d)*beat;
    if(n!=='R'){const f=nf(n);tone(song.inst||'triangle',f,f,dur*.95,song.vol||.07,t);if(song.vib)tone('sine',f*2,f*2,dur*.8,.012,t+.01);}t+=dur;}
  if(song.bass){let tb=0;for(const tok of song.bass.trim().split(/\s+/)){const [n,d]=tok.split(':');const dur=parseFloat(d)*beat;if(n!=='R'){const f=nf(n);tone('square',f,f,dur*.9,.025,tb,['lowpass',500]);}tb+=dur;}}
  if(song.drone){const f=nf(song.drone);tone('sawtooth',f,f,t,.012,0,['lowpass',300]);}
  if(loop){const len=t;setTimeout(()=>{if(gen===musicGen&&loop())playSong(song,loop);},len*1000+300);}
  return t;
}
function stopMusic(){musicGen++;}
const SONGS={
  title:{bpm:92,vib:1,drone:'D2',lead:'D4:1 Eb4:.5 F#4:.5 G4:1 F#4:.5 Eb4:.5 D4:2 A4:1 G4:.5 F#4:.5 G4:1 A4:.5 Bb4:.5 A4:2 D5:1 C5:.5 Bb4:.5 A4:1 G4:.5 F#4:.5 G4:.75 A4:.25 F#4:.5 Eb4:.5 D4:3 R:1',
    bass:'D3:2 A2:2 D3:2 A2:2 G2:2 D3:2 G2:2 D3:2 D3:2 A2:2 D3:2 A2:2 D3:4'},

  level:{bpm:150,vib:1,lead:'D4:.5 F#4:.5 A4:.5 D5:1 C5:.5 Bb4:.5 A4:.5 D5:2',bass:'D3:2 G2:1.5 D3:2'},
  death:{bpm:84,lead:'A4:.75 G4:.75 F#4:.75 Eb4:.75 D4:3',drone:'D2',vol:.07},
  boss:{bpm:132,lead:'D4:.5 D4:.25 Eb4:.25 D4:.5 C4:.5 D4:1 R:.5 A3:.5 Bb3:.5 C4:.5 D4:2',bass:'D2:1 D2:1 A1:1 D2:1 D2:1 A1:1 D2:2',vol:.06},
  ending:{bpm:96,vib:1,drone:'D2',lead:'D4:1 F#4:1 A4:1 D5:2 C#5:1 D5:1 E5:1 F#5:3 E5:1 D5:1 C#5:1 B4:1 A4:2 G4:1 F#4:1 E4:1 F#4:1 D4:4',
    bass:'D3:4 A2:4 B2:4 F#2:4 G2:4 A2:4 D3:4'},
  expired:{bpm:70,lead:'D5:1 C5:1 Bb4:1 A4:1 G4:1 F#4:1 Eb4:1 D4:4',drone:'D2',vol:.06},
};

// ═══════════════════════════ INPUT ═══════════════════════════
const held={L:0,R:0,U:0,D:0,A:0,J:0,K:0},prs={};
const KMAP={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D',
  ShiftLeft:'A',ShiftRight:'A',KeyX:'A',KeyJ:'A',Space:'J',KeyZ:'K',KeyC:'K',KeyK:'K'};
let anyPress=0;
function kd(k){if(!held[k])prs[k]=1;held[k]=1;}
function ku(k){held[k]=0;}
function releaseAll(){for(const k in held)held[k]=0;document.querySelectorAll('.tb.dn').forEach(b=>b.classList.remove('dn'));}

// ═══════════════════════════ SKELETON & KEYFRAMED POSES ═══════════════════════════
// A pose is an array of joint angles in degrees (side view, facing right):
//   0 deg = limb hanging straight down, positive = rotated forward.
//   Knees bend the shin backwards, elbows bend the forearm forwards.
// Poses are keyframed per move and interpolated with a Hermite (Catmull-Rom) spline,
// transitions cross-fade from the previous pose, the hip height comes from a ground lock
// so the lowest foot always rests on the floor (no floating, no sinking).
const HX=0,HY=1,BD=2,HD=3,NS=4,NE=5,FS=6,FE=7,NH=8,NK=9,FH=10,FK=11,SW=12,NA=13,FA=14,NP=15;
const PK={hx:HX,hy:HY,b:BD,h:HD,nS:NS,nE:NE,fS:FS,fE:FE,nH:NH,nK:NK,fH:FH,fK:FK,sw:SW,nA:NA,fA:FA};
function P(o,base){const a=base?base.slice():new Array(NP).fill(0);for(const k in o)a[PK[k]]=o[k];return a;}
const STAND=P({b:2,nS:-3,nE:8,fS:5,fE:10,nH:3,nK:3,fH:-4,fK:3});
const S=o=>P(o,STAND);
const SWAP=[[NS,FS],[NE,FE],[NH,FH],[NK,FK],[NA,FA]];
function mir(p){const a=p.slice();for(const [i,j] of SWAP){a[i]=p[j];a[j]=p[i];}return a;}
function lerpP(a,b,t,o){o=o||new Array(NP);for(let i=0;i<NP;i++)o[i]=a[i]+(b[i]-a[i])*t;return o;}

function seq(keys,loop,dur){
  const m=keys.length;dur=dur||keys[m-1][0];
  const T=keys.map(k=>k[0]),Pp=keys.map(k=>k[1]);
  const gp=j=>Pp[((j%m)+m)%m],gt=j=>T[((j%m)+m)%m]+Math.floor(j/m)*dur;

function hexRGB(h){const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
const HEXC=new Map();const rgbOf=h=>{let v=HEXC.get(h);if(!v){v=hexRGB(h);HEXC.set(h,v);}return v;};

function drawLeg(J,near,st){
  const k=near?J.nk:J.fk,a=near?J.na:J.fa,t=near?J.nt:J.ft,D=st.D;
  const c=near?st.leg:st.legD,s=near?st.shoe:st.shoeD;
  cap(0,0,k.x,k.y,D.lw,D.lw*.78,c);cap(k.x,k.y,a.x,a.y,D.lw*.74,D.lw*.5,c);
  cap(a.x,a.y,t.x,t.y,2.2,1.7,s);
}
function drawArm(J,near,st){
  const e=near?J.ne:J.fe,h=near?J.nh:J.fh;
  cap(J.sh.x,J.sh.y,e.x,e.y,3,2.6,near?st.arm:st.armD);cap(e.x,e.y,h.x,h.y,2.5,2.1,near?st.arm:st.armD);
  dot(h.x,h.y,1.25,near?st.skin:st.skinD);
}
function drawChain(ch,hx,hy,dir,col,w){
  if(!ch||!col)return;sg.strokeStyle=col;sg.lineCap='round';
  let px=(ch[0].x-hx)*dir,py=ch[0].y-hy;
  for(let i=1;i<ch.length;i++){const x=(ch[i].x-hx)*dir,y=ch[i].y-hy;sg.lineWidth=Math.max(1.1,w*(1-i/ch.length));sg.beginPath();sg.moveTo(px,py);sg.lineTo(x,y);sg.stroke();px=x;py=y;}
}
// opt: {sword:'hand'|'sheath', flask, chain, hipWX, hipWY, flash(0..1), alpha}
function renderChar(hipWX,hipWY,J,pose,dir,st,opt){
  opt=opt||{};const D=st.D;
  const ix=Math.round(hipWX),iy=Math.round(hipWY),fx=hipWX-ix,fy=hipWY-iy;
  sg.setTransform(1,0,0,1,0,0);sg.clearRect(0,0,SB,SB);
  sg.setTransform(dir,0,0,1,SO+fx,SO+fy);
  DEC.length=0;
  const L=x=>SO+fx+dir*x,Ly=y=>SO+fy+y;
  // back hair / turban tail behind everything
  if(opt.chain)drawChain(opt.chain,hipWX,hipWY,dir,st.tail,st.hat==='hair'?3.2:2);
  drawArm(J,false,st);
  drawLeg(J,false,st);
  if(!st.robe)drawLeg(J,true,st);
  if(st.robe){
    // robe / dress over both legs, feet peek out
    const xs=[J.nk.x,J.fk.x,J.na.x,J.fa.x],bot=Math.max(J.na.y,J.fa.y)-1.5;
    const fr=Math.max(...xs)+2.2,bk=Math.min(...xs)-2.4;
    sg.fillStyle=st.robe;sg.beginPath();sg.moveTo(-D.tw/2,-1);sg.lineTo(D.tw/2,-1);sg.lineTo(fr,bot);sg.lineTo(bk,bot);sg.closePath();sg.fill();
    sg.fillStyle=st.robeD;sg.beginPath();sg.moveTo(bk,bot);sg.lineTo((bk+fr)/2-1,bot);sg.lineTo(-1,0);sg.lineTo(-D.tw/2,-1);sg.closePath();sg.fill();
    cap(J.na.x,J.na.y,J.nt.x,J.nt.y,2.2,1.7,st.shoe);cap(J.fa.x,J.fa.y,J.ft.x,J.ft.y,2.2,1.7,st.shoeD);
  }
  // torso
  cap(0,-.5,J.sh.x,J.sh.y,D.tw*.86,D.tw,st.body);
  {const l=Math.hypot(J.sh.x,J.sh.y)||1,ux=J.sh.x/l,uy=J.sh.y/l,nx=-uy,ny=ux,cx=ux*2.2,cy=uy*2.2,hw=D.tw*.47,hh=.95;
   sg.fillStyle=st.belt;sg.beginPath();sg.moveTo(cx+nx*hw-ux*hh,cy+ny*hw-uy*hh);sg.lineTo(cx-nx*hw-ux*hh,cy-ny*hw-uy*hh);sg.lineTo(cx-nx*hw+ux*hh,cy-ny*hw+uy*hh);sg.lineTo(cx+nx*hw+ux*hh,cy+ny*hw+uy*hh);sg.closePath();sg.fill();}
  if(opt.sword==='sheath'){sg.strokeStyle='#3a2a1a';sg.lineWidth=1.5;sg.beginPath();sg.moveTo(-1.5,1.5);sg.lineTo(-6,9);sg.stroke();dot(-.6,.2,1.1,'#d8b040');}
  // neck & head
  cap(J.neck.x*.92,J.neck.y*.92,J.head.x,J.head.y,2.2,2.2,st.skinD);
  const hx=J.head.x,hy=J.head.y,hb=J.hb,ca=Math.cos(hb),sa=Math.sin(hb);
  const rot=(x,y)=>[hx+x*ca-y*sa,hy+x*sa+y*ca];
  if(st.hat==='hair'){const [a,b]=rot(-1,-.6);dot(a,b,D.hr+.9,st.hatC);}
  dot(hx,hy,D.hr,st.skin);
  {const [a,b]=rot(2.6,.4);dot(a,b,1.1,st.skin);} // nose/chin
  if(st.hat==='turban'){
    const [a,b]=rot(-.7,-1.6);dot(a,b,D.hr+.9,st.hatC);const [c,d]=rot(-1.4,-.4);dot(c,d,D.hr*.8,st.hatD);
    const [e,f]=rot(1.6,-3.2);decal(L(e),Ly(f),st.gem);
  }else if(st.hat==='hood'){
    const [a,b]=rot(-.8,-.9);dot(a,b,D.hr+1.3,st.hatC);const [c,d]=rot(1.2,.4);dot(c,d,D.hr*.75,st.skin);
    const [e,f]=rot(1.5,1.6);dot(e,f,1.6,st.mask);
  }else if(st.hat==='tall'){
    const [a,b]=rot(-.5,-1.8);dot(a,b,D.hr+.8,st.hatC);
    const p1=rot(-3.6,-2.6),p2=rot(3,-2.6),p3=rot(1.4,-11),p4=rot(-1.8,-11.6);
    sg.fillStyle=st.hatC;sg.beginPath();sg.moveTo(p1[0],p1[1]);sg.lineTo(p2[0],p2[1]);sg.lineTo(p3[0],p3[1]);sg.lineTo(p4[0],p4[1]);sg.closePath();sg.fill();
    const g1=rot(-3.6,-3.4),g2=rot(3,-3.4);sg.strokeStyle=st.belt;sg.lineWidth=1.3;sg.beginPath();sg.moveTo(g1[0],g1[1]);sg.lineTo(g2[0],g2[1]);sg.stroke();
    const [e,f]=rot(.2,-6.5);decal(L(e),Ly(f),st.gem);
    const b1=rot(.4,2.2),b2=rot(3.4,2.6),b3=rot(1.2,7.8);sg.fillStyle=st.beard;sg.beginPath();sg.moveTo(b1[0],b1[1]);sg.lineTo(b2[0],b2[1]);sg.lineTo(b3[0],b3[1]);sg.closePath();sg.fill();
  }else if(st.hat==='hair'){
    const [a,b]=rot(-.8,-2);dot(a,b,D.hr*.85,st.hatC);
    const [e,f]=rot(.6,-3.6);decal(L(e),Ly(f),st.tiara);const [g,h]=rot(-.6,-3.9);decal(L(g),Ly(h),st.tiara);
  }
  {const [e,f]=rot(1.5,-.5);decal(L(e),Ly(f),st.hat==='hood'?'#ffffff':'#1a0c08');}
  if(st.mous){const [e,f]=rot(1.4,1.5);decal(L(e),Ly(f),'#140a06');const [g,h]=rot(2.4,1.4);decal(L(g),Ly(h),'#140a06');}
  if(st.seal&&!opt.noSeal){decal(L(J.sh.x*.55+1.5),Ly(J.sh.y*.55),st.seal);}
  // near arm & held objects
  if(opt.flask){dot(J.nh.x+.6,J.nh.y-1,1.9,opt.flask);}
  if(opt.sword==='hand'){
    sg.strokeStyle='#d8e0ec';sg.lineWidth=1.25;sg.lineCap='round';sg.beginPath();sg.moveTo(J.nh.x,J.nh.y);sg.lineTo(J.tip.x,J.tip.y);sg.stroke();
    sg.strokeStyle='#6a4a20';sg.lineWidth=1.8;sg.beginPath();sg.moveTo(J.nh.x,J.nh.y);sg.lineTo(J.hilt.x,J.hilt.y);sg.stroke();
    const a=J.ang*R,gx=Math.cos(a)*2.4,gy=-Math.sin(a)*2.4;sg.strokeStyle='#e0b040';sg.lineWidth=1.3;sg.beginPath();sg.moveTo(J.nh.x-gx,J.nh.y-gy);sg.lineTo(J.nh.x+gx,J.nh.y+gy);sg.stroke();
  }
  drawArm(J,true,st);
  // threshold + outline
  const img=sg.getImageData(0,0,SB,SB),d=img.data,u=new Uint32Array(d.buffer);
  const mask=new Uint8Array(SB*SB);
  for(let i=0;i<SB*SB;i++){if(d[i*4+3]>=118){d[i*4+3]=255;mask[i]=1;}else u[i]=0;}
  for(let i=0;i<DEC.length;i+=3){const x=DEC[i]|0,y=DEC[i+1]|0;if(x<0||y<0||x>=SB||y>=SB)continue;const j=(y*SB+x)*4,c=rgbOf(DEC[i+2]);d[j]=c[0];d[j+1]=c[1];d[j+2]=c[2];d[j+3]=255;mask[y*SB+x]=1;}
  const fl=opt.flash||0;
  if(fl>0){for(let i=0;i<SB*SB;i++)if(mask[i]){const j=i*4;d[j]+=(255-d[j])*fl;d[j+1]+=(255-d[j+1])*fl;d[j+2]+=(255-d[j+2])*fl;}}
  const oc=opt.tint?rgbOf(opt.tint):[8,7,14];
  for(let y=1;y<SB-1;y++)for(let x=1;x<SB-1;x++){const i=y*SB+x;if(mask[i])continue;
    if(mask[i-1]||mask[i+1]||mask[i-SB]||mask[i+SB]){const j=i*4;d[j]=oc[0];d[j+1]=oc[1];d[j+2]=oc[2];d[j+3]=255;}}
  sg.setTransform(1,0,0,1,0,0);sg.putImageData(img,0,0);
  const a=opt.alpha==null?1:opt.alpha;
  if(a<1)ctx.globalAlpha=a;
  ctx.drawImage(SPR,ix-SO,iy-SO);
  ctx.globalAlpha=1;
}

const FLOORCH='.tIwk^~/SrRp@123456789Ee=abcduvoABCDQ*';
function mkTile(ch,c,r){
  const t={ch,c,r,f:FLOORCH.includes(ch),w:ch==='#',k:'floor',deco:null,item:null,st:{}};
  if(ch===' '){t.k='empty';}
  else if(ch==='#')t.k='wall';
  else if(ch==='t')t.deco='torch';else if(ch==='I')t.deco='pillar';else if(ch==='w')t.deco='window';else if(ch==='k')t.deco='bones';
  else if(ch==='^'){t.k='spike';t.st={ext:0,hold:0,snd:0};}
  else if(ch==='~'){t.k='loose';t.st={shake:-1,wob:0,amb:Math.random()*5};}
  else if(ch==='/'){t.k='chop';t.st={t:0};}
  else if(ch==='S')t.item='sword';else if(ch==='r')t.item='red';else if(ch==='R')t.item='big';else if(ch==='p')t.item='poison';
  else if('abcd'.includes(ch)){t.k='plate';t.grp=ch.toUpperCase();t.st={down:0,stuck:0};}
  else if('uv'.includes(ch)){t.k='plate';t.closer=1;t.grp=ch==='u'?'A':'B';t.st={down:0,stuck:0};}
  else if(ch==='o'){t.k='plate';t.exitp=1;t.st={down:0,stuck:0};}
  else if('ABCD'.includes(ch)){t.k='gate';t.grp=ch;t.st={open:0,hold:0,target:0,spd:.25};}
  else if(ch==='E'){t.k='door';t.st={open:0,on:0};}
  return t;
}
const VOID={ch:' ',f:false,w:false,k:'empty',st:{}},WALLT={ch:'#',f:false,w:true,k:'wall',st:{}};
let L=null;
function TL(c,r){if(!L)return VOID;if(c<0||c>=L.cols)return WALLT;if(r<0||r>=L.rows)return VOID;return L.t[r*L.cols+c];}
const colOf=x=>Math.floor(x/TW),rowOf=y=>Math.floor((y-1)/TH)+(y-1<0?0:0);
const floorY=r=>r*TH+FY;
function buildLevel(n){
  const d=LEVELS[n];const rows=d.map.map(s=>s.replace(/\|/g,''));
  const cols=rows[0].length,R=rows.length;
  const lv={n,d,cols,rows:R,rw:cols/RCOLS,rh:R/RROWS,t:[],gates:{},plates:[],chops:[],spikes:[],looses:[],doors:[],torches:[],start:null,gsp:[],cp:null,queen:null,dirty:new Set()};
  for(let r=0;r<R;r++){if(rows[r].length!==cols&&DEBUG)console.warn('row length',n,r);
    for(let c=0;c<cols;c++){const ch=rows[r][c]||'#';const t=mkTile(ch,c,r);lv.t.push(t);
      if(ch==='@')lv.start={c,r};
      if(ch>='1'&&ch<='9')lv.gsp.push({c,r,i:+ch-1});
      if(t.k==='gate'){(lv.gates[t.grp]=lv.gates[t.grp]||[]).push(t);if(d.open&&d.open[t.grp]){t.st.open=1;t.st.target=1;t.st.hold=Infinity;}}
      if(t.k==='plate')lv.plates.push(t);if(t.k==='chop'){lv.chops.push(t);t.st.t=hash(c,r,3)*1.7;}
      if(t.k==='spike')lv.spikes.push(t);if(t.k==='loose')lv.looses.push(t);if(t.k==='door')lv.doors.push(t);
      if(t.deco==='torch')lv.torches.push(t);if(ch==='*')lv.cp={c,r};if(ch==='Q')lv.queen={c,r};
    }}
  return lv;
}

// static parts of a room are painted once into a cache canvas (pixel art via fillRect)
const RC=new Map();
function px(g,c,x,y,w,h){g.fillStyle=c;g.fillRect(x,y,w,h);}
function paintWall(g,X,Y,c,r,P){
  px(g,P.mortar,X,Y,TW,TH);
  for(let k=0;k<3;k++){
    const y=Y+k*21,gr=r*3+k,o=(gr&1)?16:0;
    const b0=Math.floor((c*TW-o)/TW),b1=Math.floor((c*TW+TW-1-o)/TW);
    for(let bi=b0;bi<=b1;bi++){
      const gx0=bi*TW+o,gx1=gx0+TW-1;const x0=Math.max(gx0,c*TW),x1=Math.min(gx1,c*TW+TW);
      const lx=X+(x0-c*TW),w=x1-x0;if(w<=0)continue;
      const v=hash(bi,gr,11),base=P.wall[(v*3)|0];
      px(g,base,lx,y+1,w,19);
      px(g,P.wallL,lx,y+1,w,1);if(x0===gx0)px(g,P.wallL,lx,y+1,1,19);
      px(g,P.wallD,lx,y+19,w,1);if(x1===gx1)px(g,P.wallD,lx+w-1,y+1,1,19);

const sup=(c,r)=>TL(c,r).f;

// horizontal move with walls, gates and other fighters; returns true when blocked
function moveX(e,dx,air){
  if(!dx)return false;const s=Math.sign(dx),bw=5;let nx=e.x+dx,bl=false;
  const rows=air?[rowOf(e.y),rowOf(e.y-20)]:[rowOf(e.y)];
  for(const r of rows){
    const c=colOf(nx+s*bw);if(TL(c,r).w){const lim=s>0?c*TW-bw-.01:(c+1)*TW+bw+.01;if((lim-nx)*s<0){nx=lim;bl=true;}}
    for(let cc=colOf(e.x)-1;cc<=colOf(e.x)+1;cc++){const t=TL(cc,r);if(t.k!=='gate'||gatePass(t))continue;const gx=cc*TW+GATEX;
      if(s>0&&e.x<=gx-bw+.05&&nx>gx-bw){nx=gx-bw;bl=true;}if(s<0&&e.x>=gx+bw-.05&&nx<gx+bw){nx=gx+bw;bl=true;}}
  }
  if(!air)for(const o of fighters(e)){if(rowOf(o.y)!==rowOf(e.y)||o.act==='dead'||o.act==='fall'||o.act==='air')continue;const d=o.x-e.x;
    if(d*s>0&&Math.abs(d)>=13.9&&Math.abs(o.x-nx)<14){nx=o.x-s*14;bl=true;}}
  e.x=nx;return bl;
}
// distance (<= max) the entity can move forward on the floor without leaving it or bumping
function freeAhead(e,max,margin=4){
  const r=rowOf(e.y),s=e.dir;let d=0;
  for(let k=0;k<=max*2;k++){const dd=k/2,x=e.x+s*dd;
    if(!sup(colOf(x+s*margin),r))return Math.max(0,dd-.5<0?0:dd-.5);
    if(TL(colOf(x+s*5),r).w)return Math.max(0,dd-.5);
    for(let cc=colOf(e.x)-1;cc<=colOf(e.x)+1;cc++){const t=TL(cc,r);if(t.k==='gate'&&!gatePass(t)){const gx=cc*TW+GATEX;if(s>0&&e.x<=gx-5&&x+5>gx)return Math.max(0,dd-.5);if(s<0&&e.x>=gx+5&&x-5<gx)return Math.max(0,dd-.5);}}
    for(const o of fighters(e))if(rowOf(o.y)===r&&o.act!=='dead'&&(o.x-e.x)*s>0&&Math.abs(o.x-x)<15)return Math.max(0,dd-.5);
    d=dd;}
  return d;
}
function ledgeUp(e){

function airGrab(e,y0,y1,both){
  const dirs=both?[e.dir,-e.dir]:[e.dir];

function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.kind===2){const r=rowOf(p.y);if(p.vy>0&&sup(colOf(p.x),r)&&p.y>floorY(r)&&p.y<floorY(r)+4){p.y=floorY(r);p.vy*=-.3;p.vx*=.5;}}}}
function drawParts(){const ox=camRX*W,oy=camRY*VH;for(const p of parts){const a=clamp(p.life/p.max*1.5,0,1);if(p.kind===1)ctx.globalAlpha=a*.6;else if(p.kind===3)ctx.globalAlpha=a;
  ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x-ox),Math.round(p.y-oy),p.sz,p.sz);ctx.globalAlpha=1;}}

// ═══════════════════════════ LEVEL FLOW ═══════════════════════════
function spawnLevel(n,restart){
  L=buildLevel(n);RC.clear();levelIdx=n;
  // auto floor: an empty cell resting on masonry is walkable (matches what the eye sees)
  for(const t of L.t){if(t.k==='empty'&&TL(t.c,t.r+1).w){t.f=true;t.k='floor';t.ch='.';if(DEBUG)console.info('auto floor',t.c,t.r);}}
  if(swordLv===n)for(const t of L.t)if(t.item==='sword')t.item=null;
  const st=(restart&&cpActive&&L.cp)?L.cp:L.start;
  prince=mkEnt(ST.prince,st.c*TW+16,floorY(st.r),(restart&&cpActive&&L.cp)?-1:L.d.dir);
  prince.hp=maxHp;prince.sword=(n>0||swordLv===n)?1:0;
  if(!restart){cpActive=false;killedG.clear();}
  guards=[];
  for(const s of L.gsp){const def=L.d.guards[s.i];if(!def)continue;const T=GTYPES[def.type];
    const g=mkEnt(ST[def.type],s.c*TW+16,floorY(s.r),def.dir||(L.start.c<s.c?-1:1));
    g.gt=T;g.hp=g.maxHp=T.hp;g.sword=1;g.drawn=0;g.gid=s.c+','+s.r;g.boss=!!def.boss;g.active=0;g.cd=1;
    if(killedG.has(g.gid)){g.alive=false;g.act='dead';g.f={gone:1};g.alpha=0;}
    guards.push(g);}
  if(L.d.guards)L.d.guards.forEach((def,i)=>{if(def.dir===undefined){const sp=L.gsp.find(s=>s.i===i);if(sp){}}});
  npcs=[];
  if(L.queen){const pr=mkEnt(ST.princess,2*TW+16,floorY(L.queen.r),1);npcs.push(pr);}
  falling=[];parts=[];bossDead=guards.every(g=>!g.boss||!g.alive);
  for(const g of guards)if(g.boss&&!g.alive)openGroup('D',Infinity);
  if(L.d.wake&&!restart){setAct(prince,'wake',0);prince.pose=K.cr.slice();prince.from=K.cr.slice();prince.hipH=groundH(K.cr,DIM);prince.fromH=prince.hipH;}
  else if(!restart&&n>0){setAct(prince,'enter',0);}
  camFollow(true);
  deadT=0;tipsSeen=new Set();
  setMsg('LEVEL '+(n+1),2.2,1);msg.next=minutesText();
}
function openGroup(grp,hold){for(const g of (L.gates[grp]||[])){g.st.target=1;g.st.hold=hold;}}
function camFollow(force){
  const e=prince;const rx=clamp(roomOfX(e.x),0,L.rw-1),ry=clamp(roomOfY(e.y),0,L.rh-1);
  if(rx!==camRX||ry!==camRY||force){camRX=rx;camRY=ry;}
}
function hurt(e,n=1){
  e.hp-=n;e.flash=1;
  if(e===prince){shake(2,.15);flashT=.12;flashC='#ff2010';}
  if(e.hp<=0){if(e===prince)killPrince('hit');else killGuard(e,'hit');return true;}
  return false;
}
function killPrince(how){
  const e=prince;if(!e.alive)return;e.alive=false;e.hp=0;deaths++;
  setAct(e,'dead',how==='fall'?.06:.1);e.f.how=how;e.drawn=0;deadT=0;
  e.flash=how==='chop'||how==='spike'?1:.6;flashT=.18;flashC=how==='chop'?'#ffffff':'#ff3020';
  shake(how==='fall'?4:2,.3);
  if(how==='fall')SFX.splat();else if(how==='spike')SFX.shing();else if(how==='chop')SFX.chop();else SFX.hit();
  stopMusic();setTimeout(()=>{if(scene==='play')playSong(SONGS.death);},350);
  setMsg(how==='fall'?'A FATAL FALL':how==='spike'?'IMPALED ON THE SPIKES':how==='chop'?'CAUGHT BY THE SLICER':how==='poison'?'THE WEAK CIPHER WAS FATAL':'THE LEAF HAS FALLEN',3,3);
}
function killGuard(g,how){
  if(!g.alive)return;g.alive=false;g.hp=0;setAct(g,'dead',.1);g.f.how=how;g.flash=.8;killedG.add(g.gid);
  if(g.boss){bossDead=true;openGroup('D',Infinity);setMsg('REVOKAR IS DEFEATED. THE ROOT GATE OPENS',4,3);stopMusic();playSong(SONGS.level);}
  else setMsg(g.gt.name+' DEFEATED',2.2,1);
}
function restartLevel(){
  spawnLevel(levelIdx,true);setMsg('LEVEL '+(levelIdx+1),2,1);msg.next=minutesText();
}

// ═══════════════════════════ PRINCE STATE MACHINE ═══════════════════════════
const fwdH=e=>e.dir>0?held.R:held.L,backH=e=>e.dir>0?held.L:held.R;
const fwdP=e=>e.dir>0?prs.R:prs.L;
function nearFoe(e,range=80){let b=null,bd=1e9;for(const g of (e===prince?guards:[prince])){if(!g||!g.alive||g.act==='dead')continue;
  if(rowOf(g.y)!==rowOf(e.y))continue;if(roomOfX(g.x)!==roomOfX(e.x)&&Math.abs(g.x-e.x)>40)continue;const d=Math.abs(g.x-e.x);if(d<range&&d<bd){bd=d;b=g;}}return b;}
function startFall(e,vx){setAct(e,'fall',.18,'keep');e.vx=vx;e.vy=e.vy>0?e.vy:0;e.fallY0=e.y;e.drawn=0;}
function startHang(e,led){
  setAct(e,'rise',.12);e.f.led=led;e.dir=led.dir;e.f.h0={x:e.hipX,y:e.hipY};e.f.dur=.14;
  SFX.grab();
}
function landE(e,kind){
  const rows=Math.floor((e.y-e.fallY0+20)/TH);e.vy=0;
  const t=TL(colOf(e.x),rowOf(e.y));
  if(t.k==='loose'&&t.st.shake<0){t.st.shake=0;t.st.delay=.3;}
  if(e!==prince){guardLand(e,rows,t);return;}
  if(t.k==='spike'){t.st.ext=1;t.st.hold=1.2;killPrince('spike');e.y=floorY(rowOf(e.y));return;}
  if(rows>=3||e.y>L.rows*TH){killPrince('fall');return;}
  dust(e.x,e.y,rows>=1?8:5);
  if(rows===2){SFX.thud();shake(3,.25);if(!hurt(e))setAct(e,'hardland',.06);return;}
  if(rows===1&&kind!=='r'){SFX.land();shake(1,.1);setAct(e,'softland',.06);return;}
  SFX.land();
  if(kind==='r'){setAct(e,'rland',.06);e.spd=Math.abs(e.vx);}
  else if(kind==='s'){setAct(e,'land',.06);e.spd=Math.abs(e.vx)*.35;}
  else setAct(e,'softland',.06);
}
function itemHere(e){
  const r=rowOf(e.y);for(const c of [colOf(e.x),colOf(e.x+e.dir*14)]){const t=TL(c,r);if(t.item)return t;}return null;
}
function doorHere(e){
  const r=rowOf(e.y);for(const d of L.doors){if(d.r!==r||d.st.open<.95)continue;const x0=d.c*TW+4,x1=d.c*TW+60;if(e.x>=x0&&e.x<=x1)return d;}return null;
}
function updPrince(e){

    if(prs.J){if(bk){setAct(e,'turn',.06);e.f.q='sjump';}else startSJ(e);break;}

// ═══════════════════════════ SWORD FIGHTING ═══════════════════════════
const SSEQ=new Map();

// shared by prince (keys) and guards (AI); returns false when the action is not a fight action
function fightUpd(e,tp,isP){

      if(e.f.ripo>0)e.f.ripo-=DT;

      if(prs.A||q==='A'){startStrike(e,e.f.ripo>0?.07:.14);return true;}
      if(prs.U||prs.K||q==='U'){setAct(e,'block',.04);return true;}
      if(prs.D){setAct(e,'sheathe',.08);return true;}
      if(fwdH(e)){setAct(e,'adv',.06);return true;}
      if(backH(e)){setAct(e,'ret',.06);return true;}
    }

  case 'adv':case 'ret':{

    if(!e.f.init){e.f.init=1;e.f.x0=e.x;const d0=e.dir;if(e.act==='ret')e.dir=-d0;e.f.d=freeAhead(e,10,6);e.dir=d0;}
    const sd=e.act==='adv'?s:-s;const nx=e.f.x0+sd*e.f.d*ss(e.t/.26);moveX(e,nx-e.x);

    const w=e.f.w;sample(strikeSeq(w),e.t,tp);

    if(e.t>=w&&!e.f.sw){e.f.sw=1;SFX.swish();}
    if(e.t>=w-.02&&e.t<w+.16){const tw=tipWorld(e);e.trail.push({x:tw.x,y:tw.y,a:1});if(e.trail.length>7)e.trail.shift();}else if(e.trail.length)e.trail.shift();
    if(e.t>=w+.085&&!e.f.hit){e.f.hit=1;const tgt=isP?nearFoe(e,REACH+12):prince;if(tgt)resolveHit(e,tgt);}
    if(isP&&(prs.A||prs.U||prs.K)&&e.t>w){e.q=prs.A?'A':'U';e.qt=0;}
    if(e.t>=w+.34){e.trail.length=0;setAct(e,'fight',.05);}
    return true;}
  case 'block':{sample(A.block,e.t,tp);if(isP&&prs.A&&e.t>.1){e.q='A';e.qt=0;}if(e.t>=.4)setAct(e,'fight',.05);return true;}
  case 'parried':{sample(A.parried,e.t,tp);moveX(e,-s*10*DT);if(e.t>=.32)setAct(e,'fight',.05);return true;}
  case 'hit':{
    sample(A.hit,e.t,tp);const v=48*(1-clamp(e.t/.3,0,1));

    if(!onFloor(e)){startFall(e,-s*30);return true;}

function resolveHit(a,d){

// ═══════════════════════════ GUARDS (AI) ═══════════════════════════
function guardLand(g,rows,t){
  if(t.k==='spike'){t.st.ext=1;t.st.hold=1;killGuard(g,'spike');return;}
  if(rows>=2||g.y>L.rows*TH){killGuard(g,'fall');SFX.splat();return;}

function updGuard(g){
  g.t+=DT;const tp=TP,T=g.gt,p=prince;
  if(g.act==='dead'){
    if(g.f.how==='fall'||g.f.how==='spike')lerpP(K.dl,K.dl,0,tp);else sample(A.die,g.t,tp);
    if(g.f.gone)g.alpha=0;else if(g.t>3)g.alpha=Math.max(.35,1-(g.t-3)*.3);
    resolve(g,tp);return;}
  const sameRoom=roomOfX(g.x)===camRX&&roomOfY(g.y)===camRY;
  if(!sameRoom&&!g.active){lerpP(K.stand,K.stand,0,tp);resolve(g,tp);return;}
  const dx=p.x-g.x,d=Math.abs(dx);
  const sees=p.alive&&rowOf(p.y)===rowOf(g.y)&&d<150&&sameRoom&&!['fall','air'].includes(p.act);
  switch(g.act){
  case 'stand':{
    lerpP(K.stand,K.stand,0,tp);
    if(!onFloor(g)){startFall(g,0);break;}
    if(sees){if(dx*g.dir<0){g.dir=-g.dir;}setAct(g,'draw',.1);g.active=1;}
    break;}
  case 'fall':{
    const y0=g.y;g.vy=Math.min(MAXVY,g.vy+G*DT);moveX(g,g.vx*DT,true);g.vx*=.97;g.y+=g.vy*DT;
    lerpP(K.fall,K.fall,0,tp);tp[NS]+=Math.sin(g.t*14)*14;
    const ly=landY(g,y0,g.y,false);if(ly!=null){g.y=ly;landE(g,'f');}
    if(g.y>L.rows*TH+60){killGuard(g,'fall');g.f.gone=1;}
    break;}
  case 'hardland':sample(A.hardland,g.t*1.4,tp);if(g.t>=.95)setAct(g,'fight',.08);break;
  default:{
    if(!fightUpd(g,tp,false)){setAct(g,'fight',.1);break;}
    if(g.act!=='fight')break;
    // decisions
    if(!p.alive){if(g.t>.8&&!g.f.vic){g.f.vic=1;}lerpP(K.eg,K.eg,0,tp);break;}
    if(dx*g.dir<0&&d>4){g.dir=-g.dir;}
    g.cd-=DT;
    if(g.f.blockAt!=null){g.f.blockAt-=DT;if(g.f.blockAt<=0){g.f.blockAt=null;setAct(g,'block',.04);break;}}
    if(p.act==='strike'&&!p.f.gd){p.f.gd=1;const ch=T.block*(p.f.w<.1?.55:1);
      if(d<REACH+10&&Math.random()<ch){g.f.blockAt=Math.max(0,p.f.w-p.t-.07-Math.random()*.04);}}
    if(g.f.blockAt!=null)break;
    if(g.f.ripo>0){g.f.ripo=0;if(Math.random()<T.ripo&&d<REACH+4){startStrike(g,.08);break;}}
    if(!sees){if(d>200)g.active=0;break;}
    if(d>REACH-2){if(g.cd<.4||d>60){setAct(g,'adv',.06);}break;}
    if(d<20&&Math.random()<.5){setAct(g,'ret',.06);break;}
    if(g.cd<=0){g.cd=T.rate*(.7+Math.random()*.6);startStrike(g,T.wind*(.9+Math.random()*.2));if(T.combo&&Math.random()<T.combo)g.f.combo=1;break;}
    if(g.f.combo&&g.t>.05){g.f.combo=0;g.cd=Math.min(g.cd,.15);}
  }}

// ═══════════════════════════ TRAPS ═══════════════════════════
const DEADLY_RUN={run:1,stop:1,runturn:1,rland:1,land:1};
const GROUNDED=e=>!['air','fall','hang','rise','climb','climbdown','sjump','rjump','dead','exit'].includes(e.act);
function traps(e){
  const c=colOf(e.x),r=rowOf(e.y),t=TL(c,r);
  if(t.k==='spike'&&GROUNDED(e)&&t.st.ext>.5&&DEADLY_RUN[e.act]){if(e===prince)killPrince('spike');else killGuard(e,'spike');}
  if(t.k==='loose'&&GROUNDED(e)&&Math.abs(e.y-floorY(r))<1&&t.st.shake<0){t.st.shake=0;t.st.delay=.45;}
  for(const ch of L.chops){if(ch.r!==r||!inView(ch.c,ch.r))continue;const cx=ch.c*TW+16;
    if(Math.abs(e.x-cx)<9&&chopClose(ch)>.6&&['run','stop','step','stand','turn','land','rland','softland','fight','adv','ret','strike','block','hit','parried','runturn','crouch','chop','standup','bump','hardland'].includes(e.act)){
      if(e===prince)killPrince('chop');else killGuard(e,'chop');}}
}
function chopClose(ch){const t=ch.st.t%1.8;if(t<1.3)return 0;if(t<1.38)return (t-1.3)/.08;if(t<1.5)return 1;if(t<1.66)return 1-(t-1.5)/.16;return 0;}
function plateDown(p){
  if(p.st.stuck)return true;
  for(const e of [prince,...guards]){if(!e||!e.alive&&e!==prince)continue;if(!GROUNDED(e))continue;if(colOf(e.x)===p.c&&rowOf(e.y)===p.r&&Math.abs(e.y-floorY(p.r))<1.5)return true;}
  return false;
}
let tickAcc=0;
function updTraps(dt){
  // plates
  for(const p of L.plates){
    const dn=plateDown(p);
    if(dn&&!p.st.down){if(inView(p.c,p.r))SFX.plate();
      if(p.exitp){for(const d of L.doors)if(!d.st.on){d.st.on=1;if(inView(d.c,d.r)||inView(p.c,p.r))SFX.door();}}
      else if(p.closer){for(const g of (L.gates[p.grp]||[])){g.st.target=0;g.st.spd=6;g.st.hold=0;}}}
    if(dn&&!p.closer&&!p.exitp){const lk=(L.d.links[p.ch])||{};const h=lk.hold===undefined?6:lk.hold;for(const g of (L.gates[p.grp]||[])){if(g.st.target!==1||g.st.hold!==Infinity){g.st.target=1;g.st.hold=h;g.st.spd=.25;}}}
    p.st.down=dn;
  }
  // gates

  for(const k in L.gates)for(const g of L.gates[k]){const s=g.st,v=inView(g.c,g.r);
    const held=L.plates.some(p=>p.grp===k&&!p.closer&&!p.exitp&&p.st.down);
    if(s.target===1){if(s.open<1){s.open=Math.min(1,s.open+1.5*dt);if(v&&tk)SFX.rumble();}
      else if(s.hold!==Infinity&&!held){s.hold-=dt;if(s.hold<=0){s.target=0;s.spd=.25;}}}
    else if(s.open>0){const o0=s.open;s.open=Math.max(0,s.open-s.spd*dt);if(v&&tk&&s.spd<1)SFX.tick();if(s.open===0&&o0>0&&v){if(s.spd>1){SFX.slam();shake(2,.15);}else SFX.plate();}}
  }
  // spikes
  for(const sp of L.spikes){const s=sp.st;let trig=false;
    for(const e of [prince,...guards]){if(!e||!e.alive)continue;const r=rowOf(e.y);
      if(r===sp.r&&Math.abs(e.x-(sp.c*TW+16))<44)trig=true;
      if(colOf(e.x)===sp.c&&(e.act==='fall'||e.act==='air')&&e.y<floorY(sp.r)&&e.y>floorY(sp.r)-90)trig=true;}
    if(trig){if(s.ext<1&&s.ext===0&&inView(sp.c,sp.r))SFX.shing();s.ext=Math.min(1,s.ext+dt*14);s.hold=1;}
    else if(s.hold>0)s.hold-=dt;else s.ext=Math.max(0,s.ext-dt*3);}
  // choppers run while the prince is in their room

    if(s.shake>=0){s.shake+=dt;s.wob=Math.sin(s.shake*60)*1.2;if(inView(t.c,t.r)&&Math.random()<.25)SFX.wiggle();
      if(s.shake>=s.delay){t.k='empty';t.f=false;t.ch=' ';dirtyTile(t.c,t.r);falling.push({c:t.c,y:floorY(t.r),vy:0,r0:t.r,hit:new Set()});if(inView(t.c,t.r))SFX.crumble();}}
    else if(inView(t.c,t.r)){s.amb-=dt;if(s.amb<0){s.amb=2+Math.random()*5;s.wobT=.25;}if(s.wobT>0){s.wobT-=dt;s.wob=Math.sin(s.wobT*70)*.8;}else s.wob=0;}}
  // falling floor tiles
  for(let i=falling.length-1;i>=0;i--){const f=falling[i];const y0=f.y;f.vy=Math.min(MAXVY,f.vy+G*dt);f.y+=f.vy*dt;
    for(const e of [prince,...guards]){if(!e||!e.alive||f.hit.has(e))continue;if(colOf(e.x)!==f.c)continue;
      if(e.y>f.y+8&&e.y-40<f.y&&e.y-40>=y0-20&&e.y>floorY(f.r0)+8){f.hit.add(e);SFX.hit();
        if(!hurt(e)&&GROUNDED(e)&&e===prince)setAct(e,'crouch',.05);}}
    let landed=false;
    for(let r=f.r0+1;r<L.rows;r++){const Y=floorY(r);if(Y>y0&&Y<=f.y&&sup(f.c,r)){const t=TL(f.c,r);landed=true;
      if(t.k==='plate')t.st.stuck=1;else if(t.k==='loose'){if(t.st.shake<0){t.st.shake=0;t.st.delay=.06;}}

      if(inView(f.c,r)){SFX.crash();shake(2,.2);}debris(f.c*TW,Y);break;}}
    if(landed||f.y>L.rows*TH+80)falling.splice(i,1);}
  // exit doors

let rt=0;
function drawTorch(X,Y,t){

function updPlay(){
  if(paused)return;
  if(!frozen&&prince.act!=='exit'){timeLeft-=DT;
    const m=Math.ceil(timeLeft/60);if(m<lastMinute){lastMinute=m;if([30,15,10,5,4,3,2].includes(m))setMsg(minutesText(),3,2);}
    if(timeLeft<=60&&Math.ceil(timeLeft)!==Math.ceil(timeLeft+DT))setMsg(minutesText(),1.2,2);
    if(timeLeft<=0){timeLeft=0;gameOver();return;}}
  if(msg){msg.t+=DT;if(msg.t>=msg.d){const n=msg.next;msg=null;if(n)setMsg(n,2.5,1);}}
  if(shakeT>0)shakeT-=DT;else shakeA=0;if(flashT>0)flashT-=DT;
  updPrince(prince);if(scene!=='play')return;
  for(const g of guards)updGuard(g);
  for(const n of npcs)updNPC(n);
  updTraps(DT);updParts(DT);
  camFollow(false);
  saveT+=DT;if(saveT>10){saveT=0;save();}
}

function sysKey(k){
  if(k==='M'){audioInit();setMute(!muted);paintBtns();}
  else if(k==='P')togglePause();
  else if(k==='T'){if(scene==='play')setMsg(minutesText(),2.5,2);}
  else if(k==='X'){if(scene!=='play')return;if(restartArm>0){restartArm=0;paused=false;restartLevel();}else{restartArm=2;setMsg('PRESS R AGAIN TO RESTART THE LEVEL',2,3);}}

addEventListener('keydown',e=>{
  audioInit();if(scene==='title'&&!e.repeat&&musicGen===0&&okA())playSong(SONGS.title,()=>scene==='title');
  const c=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(c))e.preventDefault();
  if(e.ctrlKey&&c==='KeyA'){e.preventDefault();if(scene==='play'){restartArm=1;sysKey('X');}return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(c==='KeyM'){sysKey('M');return;}if(c==='KeyP'||c==='Escape'){if(scene==='title'&&inSelect){titleKey('back');return;}if(scene==='intro'){endIntro();return;}sysKey('P');return;}
  if(c==='KeyT'){sysKey('T');return;}if(c==='KeyR'){sysKey('X');return;}
  const k=KMAP[c];
  if(scene==='title'){if(e.repeat)return;if(c==='Enter'||c==='Space'||k==='A')titleKey('ok');else if(k)titleKey(k);return;}
  if(scene!=='play'){if(!e.repeat&&(c==='Enter'||c==='Space'||k==='A'))confirmKey();return;}
  if(c==='Enter'){held.E=1;prs.A=1;return;}
  if(k&&!paused)kd(k);
});

  let n=0;if(!manual){while(acc>=DT&&n<8){step();acc-=DT;n++;}if(n>=8)acc=0;}else acc=0;
  render();requestAnimationFrame(frame);
}

      guards:guards.map(g=>({type:g.gt.name,x:+g.x.toFixed(1),y:g.y,col:colOf(g.x),row:rowOf(g.y),act:g.act,t:+g.t.toFixed(3),w:g.f.w,hp:g.hp,alive:g.alive,active:g.active,dir:g.dir})),
      msg:msg&&msg.text};},
    tile:(c,r)=>{const t=TL(c,r);return {ch:t.ch,k:t.k,f:t.f,w:t.w,item:t.item,st:JSON.parse(JSON.stringify(t.st||{},(k,v)=>v===Infinity?'inf':v))};},
    map:()=>L?L.t.reduce((a,t)=>{(a[t.r]=a[t.r]||[]).push(t.ch);return a;},[]).map(r=>r.join('')):null,
    load:(lv,c,r,dir)=>{paused=false;scene='play';timeLeft=timeLeft||3600;levelIdx=lv;spawnLevel(lv,false);if(c!=null){prince.x=c*TW+16;prince.y=floorY(r);setAct(prince,'stand',0);if(dir)prince.dir=dir;camFollow(true);}msg=null;},
    tp:(x,y,dir)=>{prince.x=x;prince.y=y;if(dir)prince.dir=dir;setAct(prince,'stand',0);camFollow(true);},
    tpc:(c,r,dir)=>{prince.x=c*TW+16;prince.y=floorY(r);if(dir)prince.dir=dir;setAct(prince,'stand',0);camFollow(true);},
    setHp:n=>{prince.hp=n;},tpGuard:(i,x,dir)=>{const g=guards[i];g.x=x;if(dir)g.dir=dir;},give:w=>{if(w==='sword'){prince.sword=1;swordLv=levelIdx;}if(w==='hp')prince.hp=maxHp;if(w==='max'){maxHp++;prince.hp=maxHp;}},
    freeze:(on=true)=>{frozen=!!on;},setTime:s=>{timeLeft=s;},
    start:()=>{if(scene==='title')titleKey('ok');},intro:()=>startIntro(),card:n=>startCard(n),ending:()=>{levelIdx=LEVELS.length-1;spawnLevel(levelIdx,false);bossDead=true;startEnding();},
    over:()=>gameOver(),title:()=>goTitle(),kill:()=>killPrince('hit'),restart:()=>restartLevel(),
    killGuards:()=>guards.forEach(g=>killGuard(g,'hit')),pause:()=>togglePause(),
    get fps(){return fps;},levels:()=>LEVELS.map(l=>l.name),
    sceneT:v=>{if(v!=null)sceneT=v;return sceneT;},
    manual:(on=true)=>{manual=!!on;},
    step:(n=1)=>{for(let i=0;i<n;i++)step();render();return __pc.state;},
    cap:(x,y,w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(cv,x,y,w,h,0,0,w,h);CAPS.push(c);return CAPS.length;},
    capPrince:(w=64,h=64,dy=0)=>{const x=Math.round(prince.x-camRX*W-w/2),y=Math.round(prince.y-camRY*VH-h+8+dy);return __pc.cap(x,y,w,h);},
    sheet:(cols,sc=3,clear=true)=>{const n=CAPS.length;if(!n)return null;const w=CAPS[0].width,h=CAPS[0].height,rows=Math.ceil(n/cols);
      const c=document.createElement('canvas');c.width=cols*w*sc+(cols+1)*2;c.height=rows*h*sc+(rows+1)*2;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#402a10';g.fillRect(0,0,c.width,c.height);
      CAPS.forEach((k,i)=>g.drawImage(k,2+(i%cols)*(w*sc+2),2+Math.floor(i/cols)*(h*sc+2),w*sc,h*sc));if(clear)CAPS.length=0;return c.toDataURL('image/png');},
    pose:()=>prince&&{pose:prince.pose.map(v=>+v.toFixed(1)),hipX:prince.hipX,hipY:prince.hipY},
  };
  if(QS.has('level')){const n=Math.max(0,Math.min(LEVELS.length-1,(+QS.get('level')||1)-1));timeLeft=3600;startCard(n);beginLevel();}
}
})();
</script>
